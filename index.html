button:hover{

#result{

.result{

.table{

.error{

  letter-spacing:1px;

@media(max-width:480px){
  h1{font-size:34px}
  .card{padding:42px 20px}

function cleanName(name){

  return name
    .toLowerCase()
    .replace(/mrs\.?/g," ")
    .replace(/mr\.?/g," ")
    .replace(/ms\.?/g," ")
    .replace(/&/g," ")
    .replace(/family/g," ")
    .replace(/[().,'’]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function findTable(){

  const input =
    document.getElementById("guestName").value.trim();

  const result =
    document.getElementById("result");

  if(!input){
    result.innerHTML =
      '<div class="error">Please enter your name.</div>';
    return;
  }

  const searchName = cleanName(input);

  let matches = [];

  for(const table in seating){

    for(const guest of seating[table]){

      const guestName = cleanName(guest);

      if(guestName.includes(searchName)){

        matches.push({
          name: guest,
          table: table
        });

      }

    }

  }

  if(matches.length > 0){

    result.innerHTML = `
      <div class="result">
        <small>Matching guests</small>

        ${matches.map(match => `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #ded2c5;
          ">
            <div style="font-size:17px;">
              ${match.name}
            </div>

            <div style="
              font-size:14px;
              margin-top:5px;
              opacity:.65;
            ">
              TABLE ${match.table}
            </div>
          </div>
        `).join("")}

      </div>
    `;

  }else{

    result.innerHTML = `
      <div class="error">
        We couldn't find a matching name.<br>
        Please check the spelling and try again.
      </div>
    `;

  }

}


/* Allow guests to press ENTER */

document
  .getElementById("guestName")
  .addEventListener("keydown", function(event){

    if(event.key === "Enter"){
      findTable();
    }

  });
